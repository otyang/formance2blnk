site_name: formance2blnk
site_description: Migrate a Formance ledger into Blnk — safely, resumably and verifiably.
site_url: https://otyang.github.io/formance2blnk/
repo_url: https://github.com/otyang/formance2blnk
repo_name: otyang/formance2blnk
docs_dir: docs-src
site_dir: docs
exclude_docs: requirements.txt
edit_uri: edit/main/docs-src/
copyright: Copyright &copy; 2026 The formance2blnk Authors — MIT License

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.instant
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Why formance2blnk: why.md
  - Getting started: getting-started.md
  - Guide:
      - Concepts: concepts.md
      - Strategies: strategies.md
      - Mapping: mapping.md
      - Reconciliation: reconciliation.md
      - Cutover runbook: cutover.md
  - Reference:
      - Configuration: configuration.md
      - CLI: cli.md
      - Go library: library.md
      - Compatibility: compatibility.md
  - Examples: examples.md
  - Troubleshooting: troubleshooting.md
  - Changelog: changelog.md
  - Contributing: contributing.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
