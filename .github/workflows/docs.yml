name: Docs
on:
  push:
    branches: [main]
    paths: ["docs-src/**", "docs/**", "mkdocs.yml", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs-src/**", "docs/**", "mkdocs.yml", ".github/workflows/docs.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # GitHub Pages serves the committed docs/ folder on main; this checks it is up to date.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r docs-src/requirements.txt
      - run: make docs
      - name: Built site is committed
        # The sitemap records the build date, so it is left out of the comparison.
        run: git diff --exit-code --stat -- docs ':!docs/sitemap.xml*' || (echo "run make docs and commit docs/" && exit 1)
